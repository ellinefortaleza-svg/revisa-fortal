<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle Fortal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle Sanitário Fortal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com nome de quem registra, abas roláveis fixas no topo, cada aba = formulário em cima + registros embaixo */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#dbe2df;
  --rt:#0f7a63; --rt-soft:#e2f2ed; --mn:#b25d0c; --mn-soft:#f8ecdf; --gs:#3f4fa3; --gs-soft:#e6e9f7;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b8322a; --bad-soft:#fbe7e5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111816; --surface:#19221f; --ink:#e7eeeb; --muted:#9aa9a3; --line:#2b3632;
  --rt:#4cc9a8; --rt-soft:#173a31; --mn:#f0a35a; --mn-soft:#3b2a19; --gs:#9aa8f2; --gs-soft:#252b4a;
  --ok:#58c98a; --ok-soft:#173526; --warn:#e9b04a; --warn-soft:#3a2e14; --bad:#f07a70; --bad-soft:#3d1f1c; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
header.top{padding-block:16px 10px}
header.top .wrap{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:2px 0 0;font-weight:700}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.who label{font-weight:700;font-size:14px}
.who input{flex:1 1 200px;min-width:0}
.who.need{border-color:var(--bad);background:var(--bad-soft)}
.conn{font-size:12.5px;color:var(--muted)}
.conn.bad{color:var(--bad);font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabrow{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tabrow a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabrow a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabrow a .n{font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
main{padding-block:16px 80px}
main .wrap{display:flex;flex-direction:column;gap:16px}
.vt{font-family:var(--display);font-size:26px;margin:0;font-weight:700}
.vs{margin:-10px 0 0;color:var(--muted);font-size:14px;max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.card h3 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:13px}
.ref{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;margin:0;padding:0}
.field.full{grid-column:1/-1}
.lbl{font-size:13px;font-weight:600;color:var(--ink);padding:0}
.req{color:var(--bad)}
.help{font-size:12.5px;color:var(--muted)}
.help.ok{color:var(--ok);font-weight:600}.help.bad{color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--rt);outline-offset:1px}
.checks{display:flex;flex-direction:column;gap:4px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0;cursor:pointer}
.chk input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--rt)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs label{cursor:pointer;position:relative}
.segs input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.segs span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--bg)}
.segs input:checked+span{background:var(--rt);border-color:var(--rt);color:#fff;font-weight:600}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--rt);border-color:var(--rt);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.fotobtn{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;padding:8px 12px;border-radius:8px;border:1.5px dashed var(--rt);color:var(--rt);font-weight:600;font-size:14px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img,.pend img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}
.pend{position:relative}
.pend button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--line));text-decoration:none;color:var(--ink);min-width:0}
.tile b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.ok{--c:var(--ok)}.tile.warn{--c:var(--warn)}.tile.bad{--c:var(--bad)}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist li a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}
.plist li a::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--warn))}
.plist li.bad a{--c:var(--bad)}
.allok{color:var(--ok);font-weight:600;font-size:14px}
.tgrid{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.okc{color:var(--ok);font-weight:700}td.badc{color:var(--bad);font-weight:700}td.mis{color:var(--muted)}
.pill{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.reg{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left:4px solid var(--line)}
.reg.nc{border-left-color:var(--bad)}
.reg-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.reg-t{display:flex;flex-direction:column;min-width:0}
.kind{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.reg-d{font-size:14px;color:var(--muted)}
.reg-a{font-size:14px}
.reg-m{font-size:12.5px;color:var(--muted)}
.regs{display:flex;flex-direction:column;gap:8px}
.day{margin:6px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day small{font-weight:500}
.empty{color:var(--muted);font-size:14px;margin:0}
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums}
.feed .by{color:var(--muted)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.task:first-of-type{border-top:0}
.task .tt{font-weight:600}
.task .tm{font-size:12.5px;color:var(--muted)}
.task .ta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.o-rt{--c:var(--rt);--cs:var(--rt-soft)}.o-mn{--c:var(--mn);--cs:var(--mn-soft)}.o-gs{--c:var(--gs);--cs:var(--gs-soft)}
.area{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.area h4{margin:0;padding:10px 14px;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.area h4 small{font-family:var(--body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.st{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.st[data-s="andamento"]{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%,transparent 50% 100%)}
.st[data-s="concluido"]{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.itx{display:flex;flex-direction:column;gap:5px;min-width:0}
.find{font-weight:600}
.item.done .find{text-decoration:line-through;color:var(--muted)}
.act{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--cs);color:var(--c)}
.tag.risk{--c:var(--bad);--cs:var(--bad-soft)}
details summary{cursor:pointer;font-size:13px;color:var(--rt);font-weight:600}
.hist{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.doc{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.doc-h strong{display:block}
.doc .meta{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:100%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.mbox{border-radius:14px}}
.mbox h3{margin:0 0 10px;font-family:var(--display);font-size:22px}
.mclose{float:right}
.light{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.light img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.report{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.report h2{margin:0;font-size:20px}.report h3{margin:8px 0 0;font-size:16px;border-bottom:2px solid #111;padding-bottom:3px}
.report table{font-size:12.5px}.report th,.report td{border-bottom:1px solid #ccc;color:#111}
.report .thumbs img{width:110px;height:110px}
.sign{display:flex;flex-wrap:wrap;gap:40px;margin-top:30px}
.sign div{flex:1 1 220px;border-top:1px solid #111;padding-top:4px;font-size:12.5px;text-align:center}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.grid{font-size:12.5px}.grid th.c,.grid td.c{text-align:center;padding:5px 3px;min-width:34px}.grid td.nm{min-width:170px}.grid td.okc{background:var(--ok-soft)}
.thumbs.big img{width:132px;height:132px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:14px}.kv span{color:var(--muted)}
@media (max-width:480px){.kv{grid-template-columns:1fr}.kv b{margin-bottom:6px}}
.ajrow{grid-template-columns:minmax(0,3fr) minmax(0,1fr) auto;align-items:end;margin-bottom:6px}.ajrow2{grid-template-columns:minmax(0,1fr) auto;align-items:end;margin-bottom:6px}
@media (max-width:560px){.ajrow{grid-template-columns:minmax(0,1fr) auto}.ajrow .field:first-child{grid-column:1/-1}}
details.wk{border-top:1px solid var(--line);padding-top:8px}details.wk summary{font-size:15px;color:var(--ink)}
.report h4{margin:6px 0 0;font-size:14px}
.chips a.chip{text-decoration:none}
@media print{
  body{background:#fff}
  header.top,nav.tabs,.noprint,.toast,.modal{display:none!important}
  main{padding:0}.report{border:0;padding:0}
  .report tr,.report .thumbs{break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<header class="top pad"><div class="wrap">
  <div><div class="eyebrow">Fortal Comércio de Alimentos · Nutrição e Vigilância Sanitária</div><h1>Controle Sanitário Fortal</h1></div>
  <div class="who" id="whoBox">
    <label for="who">Quem está registrando?</label>
    <input id="who" type="text" placeholder="Seu nome e função (ex.: Thaís – Nutricionista)" autocomplete="name" maxlength="60">
  </div>
  <div class="conn" id="conn">Conectando ao servidor…</div>
</div></header>
<nav class="tabs pad"><div class="wrap tabrow" id="tabs"></div></nav>
<main class="pad"><div class="wrap" id="view"></div></main>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="btn sm mclose" id="mclose" type="button">Fechar</button><div id="mbody"></div></div></div>
<div class="light" id="light" hidden><img id="lightImg" alt="Foto ampliada"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
let FS=null, db=null, online=false;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>dKey();
const pk=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const x=pk(k);x.setDate(x.getDate()+n);return dKey(x)};
const addMonths=(k,n)=>{const x=pk(k);x.setMonth(x.getMonth()+n);return dKey(x)};
const diffDays=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
const fD=k=>k?k.split('-').reverse().join('/'):'—';
const fDs=k=>k?k.split('-').reverse().slice(0,2).join('/'):'';
const fT=iso=>{try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const fDT=iso=>{try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const isoDay=iso=>dKey(new Date(iso));
const uid=()=>Math.random().toString(36).slice(2,9);
const plural=(n,a,b)=>n+' '+(n===1?a:b);
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const weekKey=k=>{const d=pk(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dKey(d)};
const weekLbl=w=>`${fD(w)} a ${fD(addDays(w,6))}`;
const first=s=>String(s||'').split(/[ –-]/)[0];

/* ---------- nome de quem registra ---------- */
const WHO=()=>($('#who').value||'').trim();
try{$('#who').value=localStorage.getItem('fortal-revisa-nome')||''}catch(e){}
$('#who').addEventListener('input',()=>{try{localStorage.setItem('fortal-revisa-nome',WHO())}catch(e){} if(WHO())$('#whoBox').classList.remove('need')});
function needName(){if(WHO())return true;$('#whoBox').classList.add('need');window.scrollTo({top:0,behavior:'smooth'});$('#who').focus();toast('Escreva seu nome no topo antes de registrar.',true);return false}
function canSave(){if(!online){toast('Sem conexão com o servidor. Nada foi salvo.',true);return false}return needName()}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
function setConn(m,bad){const c=$('#conn');c.textContent=m;c.className='conn'+(bad?' bad':'')}

/* ---------- configuração padrão ---------- */
const DEF={
  rt:{nome:'',crn:''},
  rotina:[
    {id:'r1',nome:'Temperatura dos equipamentos — manhã',freq:'diaria'},
    {id:'r2',nome:'Temperatura dos equipamentos — tarde',freq:'diaria'},
    {id:'r3',nome:'Temperatura dos alimentos (cocção e distribuição)',freq:'diaria'},
    {id:'r4',nome:'Coleta de amostras das refeições',freq:'diaria'},
    {id:'r5',nome:'Descarte das amostras com prazo vencido',freq:'diaria'},
    {id:'r6',nome:'Recebimento de mercadorias conferido',freq:'diaria'},
    {id:'r7',nome:'Higienização diária conforme cronograma',freq:'diaria'},
    {id:'r8',nome:'Checagem de higiene e conduta da equipe',freq:'diaria'},
    {id:'r9',nome:'Lavatórios abastecidos (sabonete, papel toalha, álcool)',freq:'diaria'},
    {id:'r10',nome:'Higienização semanal (telas, paredes, coifa, freezers por dentro)',freq:'semanal'},
    {id:'r11',nome:'Conferência de validades e etiquetas (freezers e estoque)',freq:'semanal'}
  ],
  planilhas:[

async function compress(file,max0){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=max0||1280,q=max0>1500?.72:.62,out='';
    for(let k=0;k<6;k++){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<880000)break;max*=.85;q=Math.max(.4,q-.06)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

function F(fid,f){

function pendencias(){
  const P=[],h=new Date().getHours(),t=TODAY(),wk=weekKey(t),wd=pk(t).getDay();
  const dn=daily().filter(i=>!doneOn(i.id,t));if(dn.length)P.push({t:`Rotina de hoje: ${plural(dn.length,'item sem marcar','itens sem marcar')}`,v:'rotina',bad:h>=17});
  const y=addDays(t,-1),yn=daily().filter(i=>!doneOn(i.id,y));if(yn.length&&REGS.some(r=>r.tipo==='rotina'&&r.dia<=y))P.push({t:`Ontem (${fD(y)}) ficaram ${plural(yn.length,'item','itens')} sem marcar`,v:'rotina',bad:true});
  const wn=weekly().filter(i=>!doneWeek(i.id,wk));if(wn.length&&(wd===0||wd>=4))P.push({t:`Rotina semanal: ${plural(wn.length,'item pendente','itens pendentes')} nesta semana`,v:'rotina',bad:wd===0||wd===6});
  if(wd===0||wd>=5){const pn=CFG.planilhas.filter(p=>!planOf(p.id,wk).length);if(pn.length)P.push({t:`Sexta-feira: enviar fotos de ${plural(pn.length,'planilha','planilhas')} desta semana`,v:'planilhas',bad:wd!==5})}
  const lw=addDays(wk,-7),lp=CFG.planilhas.filter(p=>!planOf(p.id,lw).length);if(lp.length&&PLAN.some(r=>r.semana<=lw))P.push({t:`Semana passada (${weekLbl(lw)}): faltam fotos de ${plural(lp.length,'planilha','planilhas')}`,v:'planilhas',bad:true});
  PRAZOS.forEach(p=>{const s=prazoStatus(p);if(s.k==='bad')P.push({t:`${p.nome}: ${s.t.toLowerCase()}`,v:'prazos',bad:true});else if(s.k==='warn')P.push({t:`${p.nome}: ${s.t.toLowerCase()}`,v:'prazos'})});
  const pz=PRAZOS.filter(p=>prazoStatus(p).k==='none');if(pz.length)P.push({t:`Prazos e controles: ${plural(pz.length,'item sem data registrada','itens sem data registrada')}`,v:'prazos'});
  const risk=ITEMS.filter(i=>i[6]&&itemSt(i[0])!=='concluido');if(risk.length)P.push({t:`Relatório Revisa: ${plural(risk.length,'item de risco imediato aberto','itens de risco imediato abertos')}`,v:'revisa',bad:true});
  return P.sort((a,b)=>(b.bad?1:0)-(a.bad?1:0));
}

      [pzBad?`${pzBad} vencido${pzBad>1?'s':''}`:pzWarn?`${pzWarn} a ver`:'Em dia','Prazos e controles','prazos',pzBad?'bad':pzWarn?'warn':'ok']

    const F=feedToday();$('#h-fc').textContent=F.length?'· '+plural(F.length,'registro','registros'):'';

  }};
function feedToday(){const L=[],t=TODAY();
  REGS.filter(r=>isoDay(r.at)===t).forEach(r=>{const x=desc(r);L.push({at:r.at,por:r.por,k:TIPOS[r.tipo]||r.tipo,t:x.t+(r.tipo==='rotina'&&r.dia!==t?` (referente a ${fD(r.dia)})`:'')})});
  PLAN.filter(r=>isoDay(r.at)===t&&!REGS.includes(r)&&!REGS.some(x=>x.id===r.id)).forEach(r=>L.push({at:r.at,por:r.por,k:'Planilha',t:r.planilha}));
  ITEMS.forEach(i=>{(ITENS[i[0]]?.hist||[]).forEach(h=>{if(isoDay(h.at)===t)L.push({at:h.at,por:h.por,k:'Relatório Revisa',t:`${h.o} · ${i[2]}`})})});
  PRAZOS.forEach(p=>{(DOCS[p.id]?.hist||[]).forEach(h=>{if(isoDay(h.at)===t)L.push({at:h.at,por:h.por,k:'Prazos',t:`${p.nome} · ${h.o}`})})});
  return L.sort((a,b)=>b.at.localeCompare(a.at))}

VIEWS.rotina={tab:'Rotina diária',title:'Rotina diária',sub:'Os registros detalhados ficam nas planilhas de papel. Aqui a nutricionista marca o que foi feito; cada marcação grava nome, data e hora.',
  html:()=>`<section class="card"><div class="field" style="max-width:260px"><label class="lbl" for="ro-dia">Dia</label><input type="date" id="ro-dia"></div><p class="help" id="ro-dh"></p></section>

    $('#ro-sc').textContent=`· semana de ${weekLbl(wk)}`;

    const mark=async(it,obs,f)=>{await addReg('rotina',{itemId:it.id,item:it.nome,freq:it.freq,obs:obs||''},f,null,dia)};
    $$('[data-ok]').forEach(b=>b.onclick=async()=>{if(!canSave())return;b.disabled=true;try{await mark(CFG.rotina.find(x=>x.id===b.dataset.ok));toast('Marcado por '+WHO()+'.')}catch(e){b.disabled=false;toast('Não foi possível salvar ('+(e.code||'erro')+').',true)}});

  }};
function rotinaGrid(n,dense){const t=TODAY(),days=[];for(let i=n-1;i>=0;i--)days.push(addDays(t,-i));
  const its=CFG.rotina;
  return `<table class="grid"><thead><tr><th>Item</th>${days.map(d=>`<th class="c">${DOW[pk(d).getDay()]}<br>${fDs(d)}</th>`).join('')}</tr></thead><tbody>${its.map(it=>`<tr><td class="nm">${esc(it.nome)}${it.freq==='semanal'?' <small>(semanal)</small>':''}</td>${days.map(d=>{const r=it.freq==='semanal'?REGS.find(x=>x.tipo==='rotina'&&x.itemId===it.id&&x.dia===d):doneOn(it.id,d);return r?`<td class="c okc" title="${esc(r.por)} · ${fDT(r.at)}">✓${dense?'':`<br><small>${esc(first(r.por))}</small>`}</td>`:`<td class="c mis">${it.freq==='semanal'?'':'·'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}

let RV={owner:'rt',filt:'open'};

  html:()=>`<div class="chips" id="rv-own"></div><div class="chips" id="rv-f"></div><div id="rv-list" style="display:flex;flex-direction:column;gap:12px"></div>`,
  bind(){
    const own=[['','Todos'],...Object.entries(OWN).map(([k,o])=>[k,o.n])];
    $('#rv-own').innerHTML=own.map(([k,n])=>`<button class="chip" data-o="${k}" aria-pressed="${RV.owner===k}" type="button">${n}</button>`).join('');
    $('#rv-f').innerHTML=[['all','Todos'],['open','Em aberto'],['risk','Risco imediato'],['done','Concluídos']].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${RV.filt===k}" type="button">${n}</button>`).join('');
    $$('[data-o]').forEach(b=>b.onclick=()=>{RV.owner=b.dataset.o;$$('[data-o]').forEach(x=>x.setAttribute('aria-pressed',x===b));this.refresh(true)});
    $$('[data-f]').forEach(b=>b.onclick=()=>{RV.filt=b.dataset.f;$$('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));this.refresh(true)});
  },
  refresh(force){
    const a=document.activeElement;if(!force&&a&&a.tagName==='TEXTAREA'&&$('#rv-list').contains(a))return;
    const open=new Set($$('#rv-list details[open]').map(d=>d.dataset.id));
    const its=ITEMS.filter(i=>{if(RV.owner&&i[4]!==RV.owner)return false;const s=itemSt(i[0]);if(RV.filt==='open')return s!=='concluido';if(RV.filt==='done')return s==='concluido';if(RV.filt==='risk')return i[6]&&s!=='concluido';return true});
    const done=ITEMS.filter(i=>(!RV.owner||i[4]===RV.owner)&&itemSt(i[0])==='concluido').length,tot=ITEMS.filter(i=>!RV.owner||i[4]===RV.owner).length;
    let h=`<p class="vs" style="margin:0">${done} de ${tot} concluídos${RV.owner?' para '+OWN[RV.owner].n:''}.</p>`;
    if(!its.length)h+='<p class="empty">Nenhum item neste filtro.</p>';
    AREAS.forEach(ar=>{const g=its.filter(i=>i[1]===ar);if(!g.length)return;const all=ITEMS.filter(i=>i[1]===ar),dn=all.filter(i=>itemSt(i[0])==='concluido').length;
      h+=`<section class="area"><h4>${esc(ar)}<small>${dn}/${all.length}</small></h4>${g.map(i=>{const[id,,find,act,ow,apoio,risk]=i,s=itemSt(id),r=ITENS[id]||{};
        return `<div class="item${s==='concluido'?' done':''}"><button class="st" data-st="${id}" data-s="${s}" type="button" aria-label="Status: ${STL[s]}. Tocar para mudar">${s==='concluido'?'✓':''}</button>
        <div class="itx"><div class="find">${esc(find)}</div><div class="act">${esc(act)}</div>
        <div class="tags"><span class="tag ${OWN[ow].cls}">${OWN[ow].n}</span>${risk?'<span class="tag risk">Risco imediato</span>':''}<span>${STL[s]}${r.por?` · ${esc(r.por)} em ${fD(isoDay(r.at))}`:''}</span></div>
        ${apoio?`<div class="act">Apoio: ${esc(apoio)}</div>`:''}${thumbs(r.fotos)}
        <details data-id="${id}"${open.has(id)?' open':''}><summary>Anotar, anexar foto e ver histórico</summary>
        <textarea id="obs-${id}" placeholder="O que foi feito, data, quem executou">${esc(r.obs||'')}</textarea>
        <div class="rowbtns" style="margin-top:6px"><button class="btn sm" data-sv="${id}" type="button">Salvar anotação</button><label class="fotobtn" for="fi-${id}">+ Foto</label><input type="file" id="fi-${id}" data-fi="${id}" accept="image/*" multiple hidden></div>
        ${(r.hist||[]).length?`<ol class="hist">${r.hist.slice().reverse().map(x=>`<li>${fDT(x.at)} · ${esc(x.por)} · ${esc(x.o)}</li>`).join('')}</ol>`:''}</details></div></div>`}).join('')}</section>`});
    $('#rv-list').innerHTML=h;hydrate($('#rv-list'));

    $$('[data-fi]').forEach(inp=>inp.onchange=async()=>{if(!canSave()){inp.value='';return}const id=inp.dataset.fi,L=[];for(const f of inp.files){try{L.push(await compress(f))}catch(e){}}inp.value='';if(!L.length)return;toast('Enviando foto…');const ids=await upFotos(L,'revisa-'+id);saveItem(id,{addFotos:ids},`Anexou ${plural(ids.length,'foto','fotos')}`)});
  }};
async function saveItem(id,ch,o){const p=ITENS[id]||{};const at=new Date().toISOString();
  const d={s:ch.s||p.s||'pendente',obs:ch.obs!=null?ch.obs:(p.obs||''),at,por:WHO(),hist:[...(p.hist||[]),{o,por:WHO(),at}].slice(-30),fotos:[...(p.fotos||[]),...(ch.addFotos||[])].slice(-20)};
  try{await FS.setDoc(FS.doc(db,'itens',id),d);toast(o+'.')}catch(e){toast('Não foi possível salvar ('+(e.code||'erro')+').',true)}}

    $$('[data-pz]').forEach(b=>b.onclick=()=>{const p=PRAZOS.find(x=>x.id===b.dataset.pz),d=DOCS[p.id]||{};
      openModal(p.nome,[{k:'realizado',l:'Data em que foi feito',t:'date',def:TODAY,req:true},{k:'validade',l:'Vence em',t:'date',def:()=>addMonths(TODAY(),p.m),req:true,help:`Use a validade que está no certificado. Sugestão: ${p.m} meses após a realização.`},{k:'empresa',l:'Empresa / responsável',def:d.empresa||''},{k:'obs',l:'Observações',t:'textarea',ph:'Nº do certificado, produtos usados…'}],
        async(v,f)=>{if(v.validade<v.realizado){toast('A data de vencimento é anterior à realização.',true);return false}const ids=f.length?await upFotos(f,'prazo-'+p.id):[];const at=new Date().toISOString();
          await FS.setDoc(FS.doc(db,'docs',p.id),{realizado:v.realizado,validade:v.validade,empresa:v.empresa,obs:v.obs,at,por:WHO(),fotos:[...(d.fotos||[]),...ids].slice(-20),hist:[...(d.hist||[]),{o:`Realizado em ${fD(v.realizado)}, vence em ${fD(v.validade)}${ids.length?' · '+plural(ids.length,'foto','fotos'):''}`,por:WHO(),at}].slice(-30)})},
        {hi:true,flbl:'Foto do certificado / comprovante',after:fid=>{$('#'+fid+'-realizado').addEventListener('change',e=>{if(e.target.value)$('#'+fid+'-validade').value=addMonths(e.target.value,p.m)})}})})}};

VIEWS.fiscalizacao={tab:'Fiscalização',title:'Registros para a fiscalização',sub:'Página de consulta. Reúne certificados, planilhas, rotina, treinamentos e as adequações do relatório. Toque em qualquer foto para ampliar.',

const SECOES=[['rotina','Rotina diária (checklist)'],['planilha','Fotos das planilhas'],['trein','Treinamentos'],['ocorr','Ocorrências'],['revisa','Relatório da Revisa (situação atual)'],['prazos','Prazos e certificados (situação atual)']];
VIEWS.exportar={tab:'Exportar',title:'Relatório em PDF',sub:'Gere o relatório de um dia, de uma semana ou de um período e salve em PDF pelo botão de imprimir.',
  html:()=>`<section class="card noprint"><div class="fgrid">
    <div class="field"><label class="lbl" for="ex-de">De</label><input type="date" id="ex-de"></div><div class="field"><label class="lbl" for="ex-ate">Até</label><input type="date" id="ex-ate"></div>
    <fieldset class="field full checks" id="ex-sec"><legend class="lbl">Incluir</legend>${SECOES.map(([k,n])=>`<label class="chk"><input type="checkbox" value="${k}" checked><span>${n}</span></label>`).join('')}</fieldset>
    <label class="chk field full"><input type="checkbox" id="ex-fotos" checked><span>Incluir fotos</span></label></div>
    <div class="factions"><button class="btn primary" id="ex-go" type="button">Gerar relatório</button><button class="btn" id="ex-print" type="button" hidden>Imprimir / salvar PDF</button></div></section>
    <div id="ex-out"></div>`,
  bind(){const t=TODAY();$('#ex-de').value=weekKey(t);$('#ex-ate').value=t;$('#ex-print').onclick=()=>window.print();
    $('#ex-go').onclick=async()=>{if(!online){toast('Sem conexão com o servidor.',true);return}const de=$('#ex-de').value,ate=$('#ex-ate').value;if(!de||!ate||ate<de){toast('Confira as datas.',true);return}
      const sec=$$('#ex-sec input:checked').map(i=>i.value),wf=$('#ex-fotos').checked,b=$('#ex-go');b.disabled=true;b.textContent='Gerando…';$('#ex-print').hidden=true;
      try{const s=await FS.getDocs(FS.query(FS.collection(db,'registros'),FS.where('dia','>=',de),FS.where('dia','<=',ate)));const R=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at.localeCompare(b.at));
        $('#ex-out').innerHTML=buildReport(R,de,ate,sec,wf);await hydrate($('#ex-out'),true);$('#ex-print').hidden=false;$('#ex-out').scrollIntoView({behavior:'smooth'})}
      catch(e){console.error(e);toast('Não foi possível gerar ('+(e.code||'erro')+').',true)}finally{b.disabled=false;b.textContent='Gerar relatório'}}}};
function buildReport(R,de,ate,sec,wf){
  const per=de===ate?fD(de):`${fD(de)} a ${fD(ate)}`,rt=CFG.rt||{};
  let h=`<article class="report"><div><h2>Fortal Comércio de Alimentos LTDA — Controle sanitário</h2><div>Rua Comandante Poty, 33, loja A, 18 do Forte, Aracaju/SE · Período: ${per} · Gerado em ${fDT(new Date().toISOString())}${WHO()?' por '+esc(WHO()):''}</div></div>`;
  const tb=(cols,rows)=>`<div class="tgrid"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  if(sec.includes('rotina')){const days=[];for(let d=de;d<=ate;d=addDays(d,1))days.push(d);
    h+=`<h3>Rotina diária — checklist</h3>`+tb(['Dia',...CFG.rotina.map(i=>esc(i.nome))],days.map(d=>`<tr><td>${DOW[pk(d).getDay()]} ${fD(d)}</td>${CFG.rotina.map(it=>{const r=R.find(x=>x.tipo==='rotina'&&x.itemId===it.id&&x.dia===d);return `<td>${r?'✓ '+esc(first(r.por))+'<br><small>'+fT(r.at)+(isoDay(r.at)!==d?' '+fDs(isoDay(r.at)):'')+'</small>':''}</td>`}).join('')}</tr>`));
    const ob=R.filter(r=>r.tipo==='rotina'&&(r.obs||(r.fotos||[]).length));if(ob.length)h+=tb(['Data','Item','Observação','Responsável'],ob.map(r=>`<tr><td>${fD(r.dia)}</td><td>${esc(r.item)}</td><td>${esc(r.obs)}${wf?thumbs(r.fotos):''}</td><td>${esc(r.por)}</td></tr>`))}
  if(sec.includes('planilha')){const wks=[...new Set(PLAN.filter(r=>r.semana>=weekKey(de)&&r.semana<=ate).map(r=>r.semana))].sort();
    h+=`<h3>Planilhas de controle</h3>`+(wks.length?wks.map(w=>`<h4>Semana de ${weekLbl(w)}</h4>`+tb(['Planilha','Enviada por','Fotos'],CFG.planilhas.map(p=>{const L=planOf(p.id,w);return `<tr><td>${esc(p.nome)}</td><td>${L.length?L.map(r=>esc(r.por)+'<br><small>'+fDT(r.at)+'</small>').join('<br>'):'<b>Não enviada</b>'}</td><td>${wf?L.map(r=>thumbs(r.fotos,true)).join(''):L.reduce((a,r)=>a+r.fotos.length,0)+' foto(s)'}</td></tr>`}))).join(''):'<p>Nenhuma planilha enviada no período.</p>')}
  [['trein','Treinamentos'],['ocorr','Ocorrências']].forEach(([k,n])=>{if(!sec.includes(k))return;const L=R.filter(r=>r.tipo===k);h+=`<h3>${n} — ${plural(L.length,'registro','registros')}</h3>`;
    h+=L.length?tb(['Data','Registro','Detalhes','Responsável'],L.map(r=>{const x=desc(r);return `<tr><td>${fDT(r.at)}</td><td>${esc(x.t)}</td><td>${esc(x.d)}${r.acao?'<br><b>Ação:</b> '+esc(r.acao):''}${r.obs?'<br>'+esc(r.obs):''}${wf?thumbs(r.fotos):''}</td><td>${esc(r.por)}</td></tr>`})):'<p>Nenhum registro no período.</p>'});
  if(sec.includes('revisa')){const dn=ITEMS.filter(i=>itemSt(i[0])==='concluido').length;h+=`<h3>Relatório da Revisa — ${dn} de ${ITEMS.length} concluídos</h3>`+tb(['Área','Constatação','Responsável','Status','Último registro','Anotação'],ITEMS.map(i=>{const r=ITENS[i[0]]||{};return `<tr><td>${esc(i[1])}</td><td>${esc(i[2])}</td><td>${OWN[i[4]].n}</td><td>${STL[itemSt(i[0])]}</td><td>${r.por?esc(r.por)+'<br>'+fDT(r.at):'—'}</td><td>${esc(r.obs||'')}${wf?thumbs(r.fotos):''}</td></tr>`}))}
  if(sec.includes('prazos'))h+=`<h3>Prazos e certificados</h3>`+tb(['Controle','Situação','Realizado','Validade','Empresa / obs.'],PRAZOS.map(p=>{const d=DOCS[p.id]||{};return `<tr><td>${esc(p.nome)}</td><td>${prazoStatus(p).t}</td><td>${fD(d.realizado)}</td><td>${fD(d.validade)}</td><td>${esc([d.empresa,d.obs].filter(Boolean).join(' · '))}${wf?thumbs(d.fotos):''}</td></tr>`}));
  h+=`<div class="sign"><div>${rt.nome?esc(rt.nome):'Nutricionista Responsável Técnica'}<br>Nutricionista RT · CRN ${rt.crn?esc(rt.crn):'__________'}</div><div>Responsável legal / Gestão</div></div></article>`;return h}

VIEWS.ajustes={tab:'Ajustes',title:'Ajustes',sub:'Nutricionista responsável, itens da rotina e planilhas. As mudanças valem para todos que usam o sistema.',
  html:()=>`<section class="card"><h3>Nutricionista responsável técnica</h3><div class="fgrid"><div class="field"><label class="lbl" for="aj-rtn">Nome</label><input id="aj-rtn"></div><div class="field"><label class="lbl" for="aj-crn">CRN</label><input id="aj-crn"></div></div></section>
  <section class="card"><h3>Itens da rotina</h3><div id="aj-ro"></div><div class="rowbtns"><button class="btn sm" id="aj-addro" type="button">+ Item</button></div></section>
  <section class="card"><h3>Planilhas de papel (fotos de sexta-feira)</h3><div id="aj-pl"></div><div class="rowbtns"><button class="btn sm" id="aj-addpl" type="button">+ Planilha</button></div></section>
  <div class="factions"><button class="btn primary" id="aj-save" type="button">Salvar ajustes</button></div>`,
  bind(){WC=JSON.parse(JSON.stringify(CFG));
    $('#aj-rtn').value=WC.rt.nome||'';$('#aj-crn').value=WC.rt.crn||'';
    const drawRo=()=>{$('#aj-ro').innerHTML=WC.rotina.map((t,i)=>`<div class="fgrid ajrow"><div class="field"><label class="lbl" for="ajr-n${i}">Item</label><input id="ajr-n${i}" value="${esc(t.nome)}"></div><div class="field"><label class="lbl" for="ajr-f${i}">Frequência</label><select id="ajr-f${i}">${Object.entries(FREQ).map(([k,n])=>`<option value="${k}"${k===t.freq?' selected':''}>${n}</option>`).join('')}</select></div><button class="btn sm" data-rmr="${i}" type="button">Remover</button></div>`).join('');
      WC.rotina.forEach((t,i)=>{$('#ajr-n'+i).oninput=x=>t.nome=x.target.value;$('#ajr-f'+i).onchange=x=>t.freq=x.target.value});$$('[data-rmr]').forEach(b=>b.onclick=()=>{WC.rotina.splice(+b.dataset.rmr,1);drawRo()})};
    const drawPl=()=>{$('#aj-pl').innerHTML=WC.planilhas.map((t,i)=>`<div class="fgrid ajrow2"><div class="field"><label class="lbl" for="ajp-n${i}">Planilha</label><input id="ajp-n${i}" value="${esc(t.nome)}"></div><button class="btn sm" data-rmp="${i}" type="button">Remover</button></div>`).join('');
      WC.planilhas.forEach((t,i)=>{$('#ajp-n'+i).oninput=x=>t.nome=x.target.value});$$('[data-rmp]').forEach(b=>b.onclick=()=>{WC.planilhas.splice(+b.dataset.rmp,1);drawPl()})};
    drawRo();drawPl();
    $('#aj-addro').onclick=()=>{WC.rotina.push({id:uid(),nome:'',freq:'diaria'});drawRo()};
    $('#aj-addpl').onclick=()=>{WC.planilhas.push({id:uid(),nome:''});drawPl()};
    $('#aj-save').onclick=async()=>{if(!canSave())return;WC.rt={nome:$('#aj-rtn').value.trim(),crn:$('#aj-crn').value.trim()};WC.rotina=WC.rotina.filter(t=>t.nome.trim());WC.planilhas=WC.planilhas.filter(t=>t.nome.trim());
      try{await FS.setDoc(FS.doc(db,'config','geral'),{rt:WC.rt,rotina:WC.rotina,planilhas:WC.planilhas,por:WHO(),at:new Date().toISOString()});toast('Ajustes salvos.')}catch(e){toast('Não foi possível salvar ('+(e.code||'erro')+').',true)}}}};

/* ---------- roteamento ---------- */
const ORDER=['hoje','rotina','planilhas','prazos','revisa','treinamentos','ocorrencias','fiscalizacao','exportar','ajustes'];
function drawTabs(){const P=CFGLOADED?pendencias():[];const n=v=>P.filter(p=>p.v===v).length;
  $('#tabs').innerHTML=ORDER.map(k=>{const c=k==='hoje'?0:n(k);return `<a href="#${k}"${k===CUR?' aria-current="page"':''}>${VIEWS[k].tab}${c?`<span class="n">${c}</span>`:''}</a>`}).join('')}
function route(){let h=(location.hash||'#hoje').slice(1);if(!VIEWS[h])h='hoje';CUR=h;const v=VIEWS[h];
  $('#view').innerHTML=`<h2 class="vt">${v.title}</h2>${v.sub?`<p class="vs">${v.sub}</p>`:''}`+v.html();v.bind&&v.bind();refresh();window.scrollTo(0,0);const a=$('#tabs a[aria-current]');a&&a.scrollIntoView({block:'nearest',inline:'center'})}
function refresh(){const v=VIEWS[CUR];try{v&&v.refresh&&v.refresh()}catch(e){console.error(e)}hydrate();drawTabs()}
addEventListener('hashchange',route);
setInterval(()=>{if(CUR==='hoje')refresh()},60000);

/* ---------- conexão ---------- */
async function init(){
  if(!firebaseConfig||!firebaseConfig.projectId||String(firebaseConfig.projectId).startsWith('COLE')){setConn('Firebase não configurado: nada será salvo.',true);return}
  try{const app=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');FS=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');db=FS.getFirestore(app.initializeApp(firebaseConfig))}
  catch(e){setConn('Sem conexão com o servidor. Verifique a internet e recarregue a página.',true);return}
  online=true;setConn('Conectado: tudo que for registrado aparece para todos que abrirem o app.');
  const err=e=>{console.error(e);setConn('Não foi possível ler os dados ('+(e.code||'erro')+'). Confira as regras do Firebase.',true)};
  const byAt=(a,b)=>String(b.at).localeCompare(String(a.at));
  FS.onSnapshot(FS.query(FS.collection(db,'registros'),FS.where('dia','>=',addDays(TODAY(),-35))),s=>{REGS=s.docs.map(d=>({id:d.id,...d.data()})).sort(byAt);refresh()},err);
  FS.onSnapshot(FS.query(FS.collection(db,'registros'),FS.where('tipo','==','planilha')),s=>{PLAN=s.docs.map(d=>({id:d.id,...d.data()})).sort(byAt);refresh()},err);
  FS.onSnapshot(FS.query(FS.collection(db,'registros'),FS.where('tipo','==','trein')),s=>{TREIN=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.data||b.dia).localeCompare(String(a.data||a.dia)));refresh()},err);
  FS.onSnapshot(FS.collection(db,'itens'),s=>{ITENS={};s.forEach(d=>ITENS[d.id]=d.data());refresh()},err);
  FS.onSnapshot(FS.collection(db,'docs'),s=>{DOCS={};s.forEach(d=>DOCS[d.id]=d.data());refresh()},err);
  FS.onSnapshot(FS.doc(db,'config','geral'),s=>{if(s.exists()){const c=s.data();CFG={...JSON.parse(JSON.stringify(DEF)),rt:{...DEF.rt,...(c.rt||{})}};if(Array.isArray(c.rotina)&&c.rotina.length)CFG.rotina=c.rotina;if(Array.isArray(c.planilhas)&&c.planilhas.length)CFG.planilhas=c.planilhas}
    const firstLoad=!CFGLOADED;CFGLOADED=true;const a=document.activeElement;if(firstLoad&&!(a&&$('#view').contains(a)&&a.tagName!=='BUTTON'))route();else refresh()},e=>{CFGLOADED=true;err(e)});
}
route();init();

</script>
