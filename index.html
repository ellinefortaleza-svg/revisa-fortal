<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f7a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle Fortal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle Sanitário Fortal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabeçalho com nome de quem registra, abas roláveis fixas no topo, cada aba = formulário em cima + registros embaixo */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#dbe2df;
  --rt:#0f7a63; --rt-soft:#e2f2ed; --mn:#b25d0c; --mn-soft:#f8ecdf; --gs:#3f4fa3; --gs-soft:#e6e9f7;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#a86a00; --warn-soft:#fbf0d9; --bad:#b8322a; --bad-soft:#fbe7e5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111816; --surface:#19221f; --ink:#e7eeeb; --muted:#9aa9a3; --line:#2b3632;
  --rt:#4cc9a8; --rt-soft:#173a31; --mn:#f0a35a; --mn-soft:#3b2a19; --gs:#9aa8f2; --gs-soft:#252b4a;
  --ok:#58c98a; --ok-soft:#173526; --warn:#e9b04a; --warn-soft:#3a2e14; --bad:#f07a70; --bad-soft:#3d1f1c; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
header.top{padding-block:16px 10px}
header.top .wrap{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:30px;line-height:1.05;margin:2px 0 0;font-weight:700}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.who label{font-weight:700;font-size:14px}
.who input{flex:1 1 200px;min-width:0}
.who.need{border-color:var(--bad);background:var(--bad-soft)}
.conn{font-size:12.5px;color:var(--muted)}
.conn.bad{color:var(--bad);font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabrow{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:thin}
.tabrow a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabrow a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabrow a .n{font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
main{padding-block:16px 80px}
main .wrap{display:flex;flex-direction:column;gap:16px}
.vt{font-family:var(--display);font-size:26px;margin:0;font-weight:700}
.vs{margin:-10px 0 0;color:var(--muted);font-size:14px;max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:18px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.card h3 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:13px}
.ref{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;margin:0;padding:0}
.field.full{grid-column:1/-1}
.lbl{font-size:13px;font-weight:600;color:var(--ink);padding:0}
.req{color:var(--bad)}
.help{font-size:12.5px;color:var(--muted)}
.help.ok{color:var(--ok);font-weight:600}.help.bad{color:var(--bad);font-weight:600}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--rt);outline-offset:1px}
.checks{display:flex;flex-direction:column;gap:4px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0;cursor:pointer}
.chk input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--rt)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs label{cursor:pointer;position:relative}
.segs input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.segs span{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--bg)}
.segs input:checked+span{background:var(--rt);border-color:var(--rt);color:#fff;font-weight:600}
.factions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--rt);border-color:var(--rt);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.fotobtn{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;padding:8px 12px;border-radius:8px;border:1.5px dashed var(--rt);color:var(--rt);font-weight:600;font-size:14px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img,.pend img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}
.pend{position:relative}
.pend button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--line));text-decoration:none;color:var(--ink);min-width:0}
.tile b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.ok{--c:var(--ok)}.tile.warn{--c:var(--warn)}.tile.bad{--c:var(--bad)}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist li a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}
.plist li a::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--warn))}
.plist li.bad a{--c:var(--bad)}
.allok{color:var(--ok);font-weight:600;font-size:14px}
.tgrid{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.okc{color:var(--ok);font-weight:700}td.badc{color:var(--bad);font-weight:700}td.mis{color:var(--muted)}
.pill{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.none{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.reg{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left:4px solid var(--line)}
.reg.nc{border-left-color:var(--bad)}
.reg-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.reg-t{display:flex;flex-direction:column;min-width:0}
.kind{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.reg-d{font-size:14px;color:var(--muted)}
.reg-a{font-size:14px}
.reg-m{font-size:12.5px;color:var(--muted)}
.regs{display:flex;flex-direction:column;gap:8px}
.day{margin:6px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.day small{font-weight:500}
.empty{color:var(--muted);font-size:14px;margin:0}
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums}
.feed .by{color:var(--muted)}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.task:first-of-type{border-top:0}
.task .tt{font-weight:600}
.task .tm{font-size:12.5px;color:var(--muted)}
.task .ta{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.o-rt{--c:var(--rt);--cs:var(--rt-soft)}.o-mn{--c:var(--mn);--cs:var(--mn-soft)}.o-gs{--c:var(--gs);--cs:var(--gs-soft)}
.area{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.area h4{margin:0;padding:10px 14px;font-family:var(--display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.area h4 small{font-family:var(--body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.st{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.st[data-s="andamento"]{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%,transparent 50% 100%)}
.st[data-s="concluido"]{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.itx{display:flex;flex-direction:column;gap:5px;min-width:0}
.find{font-weight:600}
.item.done .find{text-decoration:line-through;color:var(--muted)}
.act{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--cs);color:var(--c)}
.tag.risk{--c:var(--bad);--cs:var(--bad-soft)}
details summary{cursor:pointer;font-size:13px;color:var(--rt);font-weight:600}
.hist{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.doc{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.doc-h strong{display:block}
.doc .meta{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:100%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.mbox{border-radius:14px}}
.mbox h3{margin:0 0 10px;font-family:var(--display);font-size:22px}
.mclose{float:right}
.light{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.light img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.report{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.report h2{margin:0;font-size:20px}.report h3{margin:8px 0 0;font-size:16px;border-bottom:2px solid #111;padding-bottom:3px}
.report table{font-size:12.5px}.report th,.report td{border-bottom:1px solid #ccc;color:#111}
.report .thumbs img{width:110px;height:110px}
.sign{display:flex;flex-wrap:wrap;gap:40px;margin-top:30px}
.sign div{flex:1 1 220px;border-top:1px solid #111;padding-top:4px;font-size:12.5px;text-align:center}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
@media print{
  body{background:#fff}
  header.top,nav.tabs,.noprint,.toast,.modal{display:none!important}
  main{padding:0}.report{border:0;padding:0}
  .report tr,.report .thumbs{break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<header class="top pad"><div class="wrap">
  <div><div class="eyebrow">Fortal Comércio de Alimentos · Nutrição e Vigilância Sanitária</div><h1>Controle Sanitário Fortal</h1></div>
  <div class="who" id="whoBox">
    <label for="who">Quem está registrando?</label>
    <input id="who" type="text" placeholder="Seu nome e função (ex.: Thaís – Nutricionista)" autocomplete="name" maxlength="60">
  </div>
  <div class="conn" id="conn">Conectando ao servidor…</div>
</div></header>
<nav class="tabs pad"><div class="wrap tabrow" id="tabs"></div></nav>
<main class="pad"><div class="wrap" id="view"></div></main>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="btn sm mclose" id="mclose" type="button">Fechar</button><div id="mbody"></div></div></div>
<div class="light" id="light" hidden><img id="lightImg" alt="Foto ampliada"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
let FS=null, db=null, online=false;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dKey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=()=>dKey();
const pk=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const x=pk(k);x.setDate(x.getDate()+n);return dKey(x)};
const addMonths=(k,n)=>{const x=pk(k);x.setMonth(x.getMonth()+n);return dKey(x)};
const diffDays=(a,b)=>Math.round((pk(b)-pk(a))/864e5);
const fD=k=>k?k.split('-').reverse().join('/'):'—';
const fT=iso=>{try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const fDT=iso=>{try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};
const isoDay=iso=>dKey(new Date(iso));
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtN=n=>typeof n==='number'?n.toLocaleString('pt-BR',{maximumFractionDigits:1}):(n??'');
const plural=(n,a,b)=>n+' '+(n===1?a:b);

/* ---------- nome de quem registra ---------- */
const WHO=()=>($('#who').value||'').trim();
try{$('#who').value=localStorage.getItem('fortal-revisa-nome')||''}catch(e){}
$('#who').addEventListener('input',()=>{try{localStorage.setItem('fortal-revisa-nome',WHO())}catch(e){} if(WHO())$('#whoBox').classList.remove('need')});
function needName(){if(WHO())return true;$('#whoBox').classList.add('need');window.scrollTo({top:0,behavior:'smooth'});$('#who').focus();toast('Escreva seu nome no topo antes de registrar.',true);return false}
function canSave(){if(!online){toast('Sem conexão com o servidor. Nada foi salvo.',true);return false}return needName()}
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
function setConn(m,bad){const c=$('#conn');c.textContent=m;c.className='conn'+(bad?' bad':'')}

/* ---------- configuração padrão ---------- */
const DEF={
  equip:[{id:'camara',nome:'Câmara fria',tipo:'congelado'},{id:'fz1',nome:'Freezer 1',tipo:'congelado'},{id:'fz2',nome:'Freezer 2',tipo:'congelado'},{id:'ref1',nome:'Geladeira / refrigerador',tipo:'resfriado'}],
  refeicoes:['Café da manhã','Almoço','Jantar'],
  lim:{congelado:-18,resfriado:5,quente:60,recCong:-12,recRes:7,amostraH:72},
  hig:[
    {id:'h1',area:'Cozinha',tarefa:'Bancadas e superfícies de manipulação',freq:'diaria'},
    {id:'h2',area:'Cozinha',tarefa:'Piso da cozinha e da área de cocção',freq:'diaria'},
    {id:'h3',area:'Geral',tarefa:'Ralos e grelhas (cozinha, lavagem, corredor, freezers)',freq:'diaria'},
    {id:'h4',area:'Geral',tarefa:'Lixeiras e retirada do lixo',freq:'diaria'},
    {id:'h5',area:'Sanitários',tarefa:'Sanitários feminino e masculino',freq:'diaria'},
    {id:'h6',area:'Abrigo de resíduos',tarefa:'Abrigo de resíduos e coletores',freq:'diaria'},
    {id:'h7',area:'Cozinha',tarefa:'Utensílios, panelas e equipamentos após o uso',freq:'diaria'},
    {id:'h8',area:'Cozinha',tarefa:'Lavatório de mãos abastecido (sabonete, papel, álcool)',freq:'diaria'},
    {id:'h9',area:'Área de lavagem',tarefa:'Retirada de restos de alimentos do piso',freq:'diaria'},
    {id:'h10',area:'Cozinha',tarefa:'Paredes e portas (inclusive porta de enrolar)',freq:'semanal'},
    {id:'h11',area:'Geral',tarefa:'Telas milimétricas de janelas e aberturas',freq:'semanal'},
    {id:'h12',area:'Cozinha',tarefa:'Coifa e exaustores (limpeza externa)',freq:'semanal'},
    {id:'h13',area:'Área dos freezers',tarefa:'Freezers e câmara fria por dentro',freq:'semanal'},
    {id:'h14',area:'Estoque',tarefa:'Prateleiras, estrados e paletes',freq:'semanal'},
    {id:'h15',area:'Cocção menor',tarefa:'Passthrough',freq:'semanal'},
    {id:'h16',area:'Entrada',tarefa:'Bebedouro',freq:'semanal'},

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1280,q=.62,out='';
    for(let k=0;k<5;k++){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<650000)break;max*=.8;q=Math.max(.35,q-.08)}
    return out;
  }finally{URL.revokeObjectURL(url)}
}

function F(fid,f){
  const id=`${fid}-${f.k}`,req=f.req?' <b class="req">*</b>':'',def=typeof f.def==='function'?f.def():(f.def??'');
  const lab=`<label class="lbl" for="${id}">${esc(f.l)}${req}</label>`,cls='field'+(f.full||f.t==='textarea'?' full':'');
  const help=f.help!=null?`<span class="help" id="${id}-h">${f.help}</span>`:'';
  switch(f.t){
    case 'select':return `<div class="${cls}">${lab}<select id="${id}">${(f.o||[]).map(o=>{const v=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;return `<option value="${esc(v)}"${v===def?' selected':''}>${esc(t)}</option>`}).join('')}</select>${help}</div>`;
    case 'textarea':return `<div class="${cls}">${lab}<textarea id="${id}" rows="2" placeholder="${esc(f.ph||'')}">${esc(def)}</textarea>${help}</div>`;
    case 'checks':return `<fieldset class="field full checks" id="${id}"><legend class="lbl">${esc(f.l)}</legend>${f.o.map((o,i)=>`<label class="chk"><input type="checkbox" value="${esc(o)}" id="${id}-${i}"${f.all?' checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset>`;
    case 'radio':return `<fieldset class="field${f.full?' full':''}" id="${id}"><legend class="lbl">${esc(f.l)}${req}</legend><div class="segs">${f.o.map((o,i)=>`<label><input type="radio" name="${id}" value="${esc(o)}" id="${id}-${i}"${o===def?' checked':''}><span>${esc(o)}</span></label>`).join('')}</div></fieldset>`;
    default:return `<div class="${cls}">${lab}<input id="${id}" type="${f.t||'text'}"${f.t==='number'?' step="any" inputmode="decimal"':''}${f.list?` list="${id}-dl"`:''} value="${esc(def)}" placeholder="${esc(f.ph||'')}">${f.list?`<datalist id="${id}-dl">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}${help}</div>`;
  }
}

function readForm(fid,fields){const v={};for(const f of fields){const id=`${fid}-${f.k}`;let x;
  if(f.t==='checks')x=$$(`#${id} input:checked`).map(i=>i.value);
  else if(f.t==='radio')x=($(`#${id} input:checked`)||{}).value||'';
  else{x=$('#'+id).value.trim();if(f.t==='number'&&x!==''){x=Number(x.replace(',','.'));if(isNaN(x))return{err:`"${f.l}": número inválido.`}}}
  if(f.req&&(x===''||x==null))return{err:`Preencha "${f.l}".`};v[f.k]=x}return{v}}
function resetForm(fid,fields){const fm=$('#'+fid);if(!fm)return;fm.reset();fields.forEach(f=>{const e=$(`#${fid}-${f.k}`);if(e&&f.def!=null&&!['radio','checks','select'].includes(f.t))e.value=typeof f.def==='function'?f.def():f.def});PEND[fid]=[];drawPend(fid);fm.dispatchEvent(new Event('input'))}
function bindForm(fid,fields,onSave,keep){bindFotos(fid);$('#'+fid).onsubmit=async e=>{e.preventDefault();if(!canSave())return;const r=readForm(fid,fields);if(r.err){toast(r.err,true);return}
  const btn=$(`#${fid} button[type=submit]`),old=btn.textContent;btn.disabled=true;btn.textContent='Salvando…';
  try{const ok=await onSave(r.v,PEND[fid]||[]);if(ok!==false){if(!keep)resetForm(fid,fields);else{PEND[fid]=[];drawPend(fid)}toast('Registrado por '+WHO()+'.')}}
  catch(err){console.error(err);toast('Não foi possível salvar ('+(err.code||err.message||'erro')+').',true)}

  case 'receb':return{t:`${r.produto} · ${r.fornecedor}`,d:[r.nf&&'NF '+r.nf,r.categoria,r.temp!==''&&r.temp!=null?fmtN(r.temp)+' °C':'',r.validade&&'validade '+fD(r.validade),r.decisao].filter(Boolean).join(' · ')+(r.falhas&&r.falhas.length?' · Falhas: '+r.falhas.join('; '):''),ok:r.conforme};
  case 'equipe':return{t:'Checagem da equipe',d:(r.presentes!==''&&r.presentes!=null?r.presentes+' presentes · ':'')+(r.nc&&r.nc.length?'Fora do padrão: '+r.nc.join('; '):'Todos os itens conformes')+(r.funcionarios?' · '+r.funcionarios:''),ok:r.conforme};
  case 'trein':return{t:r.tema,d:[r.data&&fD(r.data),r.ministrante,r.ch!==''&&r.ch!=null&&r.ch+' h',r.participantes&&'Participantes: '+r.participantes].filter(Boolean).join(' · '),ok:null};
  case 'ocorr':return{t:r.categoria,d:r.descricao,ok:null};
  default:return{t:r.tipo,d:'',ok:null}}}
const pill=ok=>ok===true?'<span class="pill ok">Conforme</span>':ok===false?'<span class="pill bad">Não conforme</span>':'';
function regRow(r,o={}){const x=desc(r);return `<article class="reg${x.ok===false?' nc':''}"><div class="reg-h"><div class="reg-t">${o.tipo?`<span class="kind">${TIPOS[r.tipo]}</span>`:''}<strong>${esc(x.t)}</strong></div>${pill(x.ok)}</div><div class="reg-d">${esc(x.d)}</div>${r.acao?`<div class="reg-a"><b>Ação corretiva / orientação:</b> ${esc(r.acao)}</div>`:''}${r.obs?`<div class="reg-a">${esc(r.obs)}</div>`:''}${thumbs(r.fotos)}<div class="reg-m">${esc(r.por)} · ${fDT(r.at)}</div>${o.extra?o.extra(r):''}</article>`}
function histByDay(list,o={}){if(!list.length)return `<p class="empty">${o.empty||'Nenhum registro nos últimos 8 dias.'}</p>`;const g={};list.forEach(r=>(g[r.dia]=g[r.dia]||[]).push(r));return Object.keys(g).sort().reverse().map(d=>`<h4 class="day">${d===TODAY()?'Hoje':fD(d)} <small>· ${plural(g[d].length,'registro','registros')}</small></h4><div class="regs">${g[d].map(r=>regRow(r,o)).join('')}</div>`).join('')}

/* ---------- status ---------- */
const turnoAtual=()=>new Date().getHours()<13?'Manhã':'Tarde';
function tempStatus(){const tr=todayRegs('temp');return CFG.equip.map(e=>({e,m:tr.find(r=>r.equipId===e.id&&r.turno==='Manhã'),t:tr.find(r=>r.equipId===e.id&&r.turno==='Tarde')}))}
function higStatus(task){const l=HIG[task.id];if(!l||!l.at)return{done:false,last:null,late:true};const days=diffDays(isoDay(l.at),TODAY());const lim=task.freq==='diaria'?0:task.freq==='semanal'?6:30;return{done:days<=lim,last:l,days}}
function prazoStatus(p){const d=DOCS[p.id];if(!d||!d.validade)return{k:'none',t:'Sem registro'};const n=diffDays(TODAY(),d.validade);if(n<0)return{k:'bad',t:`Vencido há ${plural(-n,'dia','dias')}`};if(n<=30)return{k:'warn',t:n===0?'Vence hoje':`Vence em ${plural(n,'dia','dias')}`};return{k:'ok',t:`Em dia · vence em ${fD(d.validade)}`}}
const amostrasAbertas=()=>REGS.filter(r=>r.tipo==='amostra'&&!r.descartada);
const amostrasDescartar=()=>amostrasAbertas().filter(r=>r.descarteEm&&new Date(r.descarteEm)<=new Date());

function pendencias(){
  const P=[];const h=new Date().getHours();
  tempStatus().forEach(s=>{if(!s.m)P.push({t:`Temperatura da manhã: ${s.e.nome}`,v:'temperaturas',bad:h>=12});if(!s.t&&h>=13)P.push({t:`Temperatura da tarde: ${s.e.nome}`,v:'temperaturas',bad:h>=17})});
  todayRegs('temp').filter(r=>r.conforme===false).forEach(r=>P.push({t:`${r.equipNome} fora do limite (${fmtN(r.temp)} °C): acompanhar ação corretiva`,v:'temperaturas',bad:true}));
  const am=todayRegs('amostra');CFG.refeicoes.forEach(rf=>{if(!am.some(r=>r.refeicao===rf))P.push({t:`Coletar amostra: ${rf}`,v:'amostras'})});
  amostrasDescartar().forEach(r=>P.push({t:`Amostra pode ser descartada: ${r.refeicao} de ${fD(r.dia)}`,v:'amostras'}));
  const hd=CFG.hig.filter(t=>t.freq==='diaria'&&!higStatus(t).done);if(hd.length)P.push({t:`Higienização diária: ${plural(hd.length,'tarefa pendente','tarefas pendentes')}`,v:'higienizacao',bad:h>=16});
  const ha=CFG.hig.filter(t=>t.freq!=='diaria'&&!higStatus(t).done);if(ha.length===1)P.push({t:`Higienização ${FREQ[ha[0].freq].toLowerCase()} atrasada: ${ha[0].tarefa}`,v:'higienizacao',bad:true});else if(ha.length)P.push({t:`Higienização semanal/mensal: ${ha.length} tarefas em atraso ou nunca registradas`,v:'higienizacao',bad:true});
  if(!todayRegs('equipe').length)P.push({t:'Checagem de higiene e conduta da equipe',v:'equipe'});
  PRAZOS.forEach(p=>{const s=prazoStatus(p);if(s.k==='bad')P.push({t:`${p.nome}: ${s.t.toLowerCase()}`,v:'prazos',bad:true});else if(s.k==='warn')P.push({t:`${p.nome}: ${s.t.toLowerCase()}`,v:'prazos'});});const pn=PRAZOS.filter(p=>prazoStatus(p).k==='none');if(pn.length)P.push({t:`Prazos e controles: ${plural(pn.length,'item sem data registrada','itens sem data registrada')} (dedetização, filtro, caixa d'água…)`,v:'prazos'});
  const risk=ITEMS.filter(i=>i[6]&&itemSt(i[0])!=='concluido');if(risk.length)P.push({t:`Relatório Revisa: ${plural(risk.length,'item de risco imediato aberto','itens de risco imediato abertos')}`,v:'revisa',bad:true});
  return P.sort((a,b)=>(b.bad?1:0)-(a.bad?1:0));
}

  }};
function tempTable(){const ts=tempStatus();const c=r=>r?`<td class="${r.conforme?'okc':'badc'}">${fmtN(r.temp)} °C<br><small>${esc(r.por.split(' ')[0])} ${fT(r.at)}</small></td>`:'<td class="mis">—</td>';

function feedToday(){const L=[];todayRegs().forEach(r=>{const x=desc(r);L.push({at:r.at,por:r.por,k:TIPOS[r.tipo],t:x.t+(r.tipo==='temp'||r.tipo==='tempalim'?' · '+fmtN(r.temp)+' °C':''),ok:x.ok});if(r.descartada&&isoDay(r.descartada.at)===TODAY())L.push({at:r.descartada.at,por:r.descartada.por,k:'Amostra descartada',t:r.refeicao+' de '+fD(r.dia)})});

  ITEMS.forEach(i=>{(ITENS[i[0]]?.hist||[]).forEach(h=>{if(isoDay(h.at)===TODAY())L.push({at:h.at,por:h.por,k:'Relatório Revisa',t:`${h.o} · ${i[2]}`})})});
  PRAZOS.forEach(p=>{(DOCS[p.id]?.hist||[]).forEach(h=>{if(isoDay(h.at)===TODAY())L.push({at:h.at,por:h.por,k:'Prazos',t:`${p.nome} · ${h.o}`})})});
  return L.sort((a,b)=>b.at.localeCompare(a.at))}

function buildReport(R,de,ate,sec,wf){
  const per=de===ate?fD(de):`${fD(de)} a ${fD(ate)}`;
  let h=`<article class="report"><div><h2>Fortal Comércio de Alimentos LTDA — Controle sanitário</h2><div>Rua Comandante Poty, 33, loja A, 18 do Forte, Aracaju/SE · Período: ${per} · Gerado em ${fDT(new Date().toISOString())}${WHO()?' por '+esc(WHO()):''}</div></div>`;
  const tb=(cols,rows)=>`<div class="tgrid"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  SECOES.forEach(([k,n])=>{if(!sec.includes(k))return;
    if(k==='revisa'){const rows=ITEMS.map(i=>{const r=ITENS[i[0]]||{};return `<tr><td>${esc(i[1])}</td><td>${esc(i[2])}</td><td>${OWN[i[4]].n}</td><td>${STL[itemSt(i[0])]}</td><td>${r.por?esc(r.por)+'<br>'+fDT(r.at):'—'}</td><td>${esc(r.obs||'')}${wf?thumbs(r.fotos):''}</td></tr>`});
      const dn=ITEMS.filter(i=>itemSt(i[0])==='concluido').length;h+=`<h3>${n} — ${dn} de ${ITEMS.length} concluídos</h3>`+tb(['Área','Constatação','Responsável','Status','Último registro','Anotação'],rows);return}
    if(k==='prazos'){h+=`<h3>${n}</h3>`+tb(['Controle','Situação','Realizado','Vence','Registrado por','Obs.'],PRAZOS.map(p=>{const d=DOCS[p.id]||{};return `<tr><td>${esc(p.nome)}</td><td>${prazoStatus(p).t}</td><td>${fD(d.realizado)}</td><td>${fD(d.validade)}</td><td>${esc(d.por||'—')}</td><td>${esc([d.empresa,d.obs].filter(Boolean).join(' · '))}${wf?thumbs(d.fotos):''}</td></tr>`}));return}
    const L=R.filter(r=>r.tipo===k);const nc=L.filter(r=>desc(r).ok===false).length;
    h+=`<h3>${n} — ${plural(L.length,'registro','registros')}${nc?` · ${nc} não conforme${nc>1?'s':''}`:''}</h3>`;
    if(!L.length){h+='<p>Nenhum registro no período.</p>';return}
    h+=tb(['Data e hora','Registro','Detalhes','Situação','Responsável'],L.map(r=>{const x=desc(r);return `<tr><td>${fDT(r.at)}</td><td>${esc(x.t)}</td><td>${esc(x.d)}${r.acao?'<br><b>Ação:</b> '+esc(r.acao):''}${r.obs?'<br>'+esc(r.obs):''}${wf?thumbs(r.fotos):''}</td><td>${x.ok===true?'Conforme':x.ok===false?'<b>Não conforme</b>':'—'}</td><td>${esc(r.por)}</td></tr>`}))});
  h+=`<div class="sign"><div>Nutricionista Responsável Técnica<br>CRN: __________</div><div>Responsável legal / Gestão</div></div></article>`;return h}

  <div class="factions"><button class="btn primary" id="aj-save" type="button">Salvar ajustes</button></div>`,
  bind(){WC=JSON.parse(JSON.stringify(CFG));const self=this;
    const drawEq=()=>{$('#aj-eq').innerHTML=WC.equip.map((e,i)=>`<div class="fgrid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;align-items:end;margin-bottom:6px"><div class="field"><label class="lbl" for="aje-n${i}">Nome</label><input id="aje-n${i}" value="${esc(e.nome)}"></div><div class="field"><label class="lbl" for="aje-t${i}">Tipo</label><select id="aje-t${i}">${Object.entries(TIPOEQ).map(([k,n])=>`<option value="${k}"${k===e.tipo?' selected':''}>${n}</option>`).join('')}</select></div><button class="btn sm" data-rmeq="${i}" type="button">Remover</button></div>`).join('');
      WC.equip.forEach((e,i)=>{$('#aje-n'+i).oninput=x=>e.nome=x.target.value;$('#aje-t'+i).onchange=x=>e.tipo=x.target.value});$$('[data-rmeq]').forEach(b=>b.onclick=()=>{WC.equip.splice(+b.dataset.rmeq,1);drawEq()})};
    const drawHig=()=>{$('#aj-hig').innerHTML=WC.hig.map((t,i)=>`<div class="fgrid" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr) auto;align-items:end;margin-bottom:6px"><div class="field"><label class="lbl" for="ajh-a${i}">Área</label><input id="ajh-a${i}" value="${esc(t.area)}"></div><div class="field"><label class="lbl" for="ajh-t${i}">Tarefa</label><input id="ajh-t${i}" value="${esc(t.tarefa)}"></div><div class="field"><label class="lbl" for="ajh-f${i}">Frequência</label><select id="ajh-f${i}">${Object.entries(FREQ).map(([k,n])=>`<option value="${k}"${k===t.freq?' selected':''}>${n}</option>`).join('')}</select></div><button class="btn sm" data-rmh="${i}" type="button">Remover</button></div>`).join('');
      WC.hig.forEach((t,i)=>{$('#ajh-a'+i).oninput=x=>t.area=x.target.value;$('#ajh-t'+i).oninput=x=>t.tarefa=x.target.value;$('#ajh-f'+i).onchange=x=>t.freq=x.target.value});$$('[data-rmh]').forEach(b=>b.onclick=()=>{WC.hig.splice(+b.dataset.rmh,1);drawHig()})};
    drawEq();drawHig();$('#aj-ref').value=WC.refeicoes.join('\n');
    const LIM=[['congelado','Congelados — máximo (°C)'],['resfriado','Resfriados — máximo (°C)'],['quente','Quente — mínimo (°C)'],['recCong','Recebimento congelados — máximo (°C)'],['recRes','Recebimento resfriados — máximo (°C)'],['amostraH','Guarda de amostras (horas)']];
    $('#aj-lim').innerHTML=LIM.map(([k,n])=>`<div class="field"><label class="lbl" for="ajl-${k}">${n}</label><input id="ajl-${k}" type="number" step="any" value="${WC.lim[k]}"></div>`).join('');
    $('#aj-addeq').onclick=()=>{WC.equip.push({id:uid(),nome:'Novo equipamento',tipo:'resfriado'});drawEq()};
    $('#aj-addhig').onclick=()=>{WC.hig.push({id:uid(),area:'',tarefa:'',freq:'diaria'});drawHig()};
    $('#aj-save').onclick=async()=>{if(!canSave())return;WC.refeicoes=$('#aj-ref').value.split('\n').map(s=>s.trim()).filter(Boolean);LIM.forEach(([k])=>{const v=Number($('#ajl-'+k).value);if(!isNaN(v))WC.lim[k]=v});
      WC.equip=WC.equip.filter(e=>e.nome.trim());WC.hig=WC.hig.filter(t=>t.tarefa.trim());
      try{await FS.setDoc(FS.doc(db,'config','geral'),{equip:WC.equip,refeicoes:WC.refeicoes,lim:WC.lim,hig:WC.hig,por:WHO(),at:new Date().toISOString()});toast('Ajustes salvos.')}catch(e){toast('Não foi possível salvar ('+(e.code||'erro')+').',true)}}}};

/* ---------- roteamento ---------- */
const ORDER=['hoje','temperaturas','amostras','higienizacao','recebimento','equipe','treinamentos','ocorrencias','revisa','prazos','exportar','ajustes'];
function drawTabs(){const P=CFGLOADED?pendencias():[];const n=v=>P.filter(p=>p.v===v).length;
  $('#tabs').innerHTML=ORDER.map(k=>{const c=k==='hoje'?0:n(k);return `<a href="#${k}"${k===CUR?' aria-current="page"':''}>${VIEWS[k].tab}${c?`<span class="n">${c}</span>`:''}</a>`}).join('');
  const a=$('#tabs a[aria-current]');a&&a.scrollIntoView({block:'nearest',inline:'nearest'})}
function route(){let h=(location.hash||'#hoje').slice(1);if(!VIEWS[h])h='hoje';CUR=h;const v=VIEWS[h];
  $('#view').innerHTML=`<h2 class="vt">${v.title}</h2>${v.sub?`<p class="vs">${v.sub}</p>`:''}`+v.html();v.bind&&v.bind();refresh();window.scrollTo(0,0)}
function refresh(){const v=VIEWS[CUR];try{v&&v.refresh&&v.refresh()}catch(e){console.error(e)}hydrate();drawTabs()}
addEventListener('hashchange',route);
setInterval(()=>{if(CUR==='hoje')refresh()},60000);

/* ---------- conexão ---------- */
async function init(){
  if(!firebaseConfig||!firebaseConfig.projectId||String(firebaseConfig.projectId).startsWith('COLE')){setConn('Firebase não configurado: nada será salvo.',true);return}
  try{const app=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');FS=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');db=FS.getFirestore(app.initializeApp(firebaseConfig))}
  catch(e){setConn('Sem conexão com o servidor. Verifique a internet e recarregue a página.',true);return}
  online=true;setConn('Conectado: tudo que for registrado aparece para todos que abrirem o app.');
  const err=e=>{console.error(e);setConn('Não foi possível ler os dados ('+(e.code||'erro')+'). Confira as regras do Firebase.',true)};
  FS.onSnapshot(FS.query(FS.collection(db,'registros'),FS.where('dia','>=',addDays(TODAY(),-8))),s=>{REGS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.at).localeCompare(String(a.at)));refresh()},err);
  FS.onSnapshot(FS.collection(db,'itens'),s=>{ITENS={};s.forEach(d=>ITENS[d.id]=d.data());refresh()},err);
  FS.onSnapshot(FS.collection(db,'docs'),s=>{DOCS={};s.forEach(d=>DOCS[d.id]=d.data());refresh()},err);
  FS.onSnapshot(FS.doc(db,'status','higiene'),s=>{HIG=s.exists()?s.data():{};refresh()},err);
  FS.onSnapshot(FS.doc(db,'config','geral'),s=>{if(s.exists()){const c=s.data();CFG={...JSON.parse(JSON.stringify(DEF)),...c,lim:{...DEF.lim,...(c.lim||{})}}}const first=!CFGLOADED;CFGLOADED=true;
    const a=document.activeElement;if(first&&!(a&&$('#view').contains(a)&&a.tagName!=='BUTTON'))route();else refresh()},e=>{CFGLOADED=true;err(e)});
}
route();init();
</script>
</body>
</html>
